# ==============================================================================
# HireFlow Release & Container Packaging Workflow (DRAFT / INACTIVE TEMPLATE)
# Trigger: Manual workflow_dispatch only. Never automatically triggers on push.
# Permissions: packages: write, contents: write (Scoped to repo GITHUB_TOKEN)
# ==============================================================================

name: HireFlow Release Packaging (Draft)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Semantic Version (e.g., v1.0.0-rc1)'
        required: true
        type: string
      publish_to_ghcr:
        description: 'Publish container images to GitHub Container Registry (ghcr.io)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-package:
    name: Build & Package Containers
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ inputs.publish_to_ghcr }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Package Backend Image
      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: ${{ inputs.publish_to_ghcr }}
          tags: |
            ghcr.io/${{ github.repository }}/hireflow-backend:${{ inputs.release_version }}
            ghcr.io/${{ github.repository }}/hireflow-backend:latest

      # 2. Package Frontend Image
      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: ${{ inputs.publish_to_ghcr }}
          tags: |
            ghcr.io/${{ github.repository }}/hireflow-frontend:${{ inputs.release_version }}
            ghcr.io/${{ github.repository }}/hireflow-frontend:latest
