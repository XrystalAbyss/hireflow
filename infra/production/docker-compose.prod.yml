# ==============================================================================
# HireFlow Production Docker Compose Stack
# Architecture: Single-origin Caddy reverse proxy -> Spring Boot API -> Private PostgreSQL 16
# Security: Private internal network, no public database ports, secret injection
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Reverse Proxy & Frontend Static File Server
  # ----------------------------------------------------------------------------
  proxy:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: hireflow-frontend:latest
    container_name: hireflow-prod-proxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      HIREFLOW_DOMAIN: ${HIREFLOW_DOMAIN:-hireflow.example.com}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - hireflow_internal
    depends_on:
      backend:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 2. Spring Boot REST API
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: hireflow-backend:latest
    container_name: hireflow-prod-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8081
      HIREFLOW_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-hireflow_prod}
      HIREFLOW_DB_USER: ${APP_DB_USER:-hireflow_app}
      HIREFLOW_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
      HIREFLOW_ADMIN_INITIAL_PASSWORD: ${HIREFLOW_ADMIN_INITIAL_PASSWORD:?HIREFLOW_ADMIN_INITIAL_PASSWORD is required}
      HIREFLOW_COOKIE_SECURE: "true"
      HIREFLOW_API_CORS_ALLOWED_ORIGINS: "https://${HIREFLOW_DOMAIN:-hireflow.example.com}"
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -Duser.timezone=UTC"
    networks:
      - hireflow_internal
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # 3. Dedicated PostgreSQL 16 Database (No Host Port Exposed)
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: hireflow-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_BOOTSTRAP_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_BOOTSTRAP_PASSWORD:?POSTGRES_BOOTSTRAP_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-hireflow_prod}
      APP_DB_USER: ${APP_DB_USER:-hireflow_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    volumes:
      - hireflow_prod_pgdata:/var/lib/postgresql/data
      - ./infra/cap8-integration/init/01-init-role-and-db.sh:/docker-entrypoint-initdb.d/01-init-role-and-db.sh:ro
    networks:
      - hireflow_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_BOOTSTRAP_USER:-postgres} -d ${POSTGRES_DB:-hireflow_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  hireflow_internal:
    driver: bridge
    internal: false

volumes:
  hireflow_prod_pgdata:
  caddy_data:
  caddy_config:
