# ==============================================================================
# HireFlow — Render Blueprint Infrastructure-as-Code (render.yaml)
# Single-origin Spring Boot 4 + React 19 Web Service with PostgreSQL
# ==============================================================================

services:
  - type: web
    name: hireflow-prod
    env: docker
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: HIREFLOW_COOKIE_SECURE
        value: "true"
      - key: JAVA_OPTS
        value: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=55.0 -XX:InitialRAMPercentage=25.0 -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=128m -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC"
