# ==============================================================================
# HireFlow REST API Configuration (Stage 4A — Spring Boot 3.3.4)
# ==============================================================================

# Server configuration
server.port=${HIREFLOW_API_PORT:${PORT:8081}}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Application identity
spring.application.name=hireflow-api
spring.main.banner-mode=off

# Configuration import for local credentials (gitignored hireflow-local.properties)
spring.config.import=optional:file:../hireflow-local.properties,optional:file:hireflow-local.properties

# PostgreSQL Datasource configuration
# Resolves in order: System/Env -> hireflow-local.properties -> defaults
spring.datasource.url=${hireflow.db.url:${HIREFLOW_DB_URL:jdbc:postgresql://localhost:5432/hireflow_dev}}
spring.datasource.username=${hireflow.db.user:${HIREFLOW_DB_USER:hireflow_user}}
spring.datasource.password=${hireflow.db.password:${HIREFLOW_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP high-performance connection pool configuration
spring.datasource.hikari.pool-name=HireFlowApiHikariPool
spring.datasource.hikari.maximum-pool-size=${HIREFLOW_DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${HIREFLOW_DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${HIREFLOW_DB_CONN_TIMEOUT:20000}
spring.datasource.hikari.idle-timeout=${HIREFLOW_DB_IDLE_TIMEOUT:30000}
spring.datasource.hikari.max-lifetime=${HIREFLOW_DB_MAX_LIFETIME:600000}

# Flyway schema ownership preservation
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# Hibernate ORM & Jakarta Persistence (JPA) configuration
# Schema generation is strictly validation-only: never create, create-drop or update!
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Security & error handling: stack traces and raw error messages are suppressed
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# HTTP Session and Cookie Security
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${HIREFLOW_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# CORS Allowed Origins
hireflow.api.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000
