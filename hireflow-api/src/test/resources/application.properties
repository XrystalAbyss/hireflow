# ==============================================================================
# HireFlow REST API Test Configuration (Testing against PostgreSQL hireflow_test)
# ==============================================================================

spring.application.name=hireflow-api-test
spring.main.banner-mode=off

# Import local credentials
spring.config.import=optional:file:../hireflow-local.properties,optional:file:hireflow-local.properties

# PostgreSQL Test Database
spring.datasource.url=${hireflow.db.url:${HIREFLOW_DB_URL:jdbc:postgresql://localhost:5432/hireflow_test}}
spring.datasource.username=${hireflow.db.user:${HIREFLOW_DB_USER:hireflow_user}}
spring.datasource.password=${hireflow.db.password:${HIREFLOW_DB_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Test HikariCP connection pool
spring.datasource.hikari.pool-name=HireFlowApiTestPool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000

# Flyway schema validation
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.locations=classpath:db/migration

# Hibernate validation-only mode against PostgreSQL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Safe error handling
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# HTTP Session and Cookie Security
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${HIREFLOW_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=cookie

# CORS Allowed Origins
hireflow.api.cors.allowed-origins=http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000
